[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsi-hello-world"
version = "0.1.0"
description = "Обработка HSI-изображений из .mat файлов в sRGB PNG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Милованов Антон", email = "milowanow.anton@gmail.com" }
]
keywords = ["hsi", "hyperspectral", "image", "srgb", "color-correction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# --- Основные зависимости ---
dependencies = [
    "numpy>=1.21",
    "pymatreader>=0.1.0",
    "Pillow>=9.0",
    "requests>=2.32.5",
    "setuptools<82",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "einops>=0.8.2",
    "pycocotools>=2.0.11",
    "psutil>=7.2.2",
    "tensorboard>=2.21.0",
    "memory-profiler>=0.61.0",
    "mlflow>=3.1.4",
    "boto3"
]

[tool.setuptools.packages.find]
include = ["hsi_hello_world*"]
exclude = ["generated*", "downloaded*", "tests*"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
sam3 = { git = "https://github.com/facebookresearch/sam3.git" }

# --- Опциональные зависимости (по группам) ---
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]